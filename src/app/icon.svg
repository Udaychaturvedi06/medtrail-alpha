<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient representing Trust (Blue) and Health (Teal/Emerald) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGradient)" />

  <!-- Subtle grid/mesh background overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="2">
    <path d="M0 128 H 512 M0 256 H 512 M0 384 H 512" />
    <path d="M128 0 V 512 M256 0 V 512 M384 0 V 512" />
  </g>

  <!-- Medical Cross Accent -->
  <path d="M 384 96 L 384 160 M 352 128 L 416 128" stroke="#ffffff" stroke-opacity="0.8" stroke-width="20" stroke-linecap="round"/>

  <!-- The EKG 'M' Waveform -->
  <path 
    d="M 64 300 
       L 112 300 
       L 128 268 
       L 144 300 
       L 200 160 
       L 256 280 
       L 312 160 
       L 368 300 
       L 384 268 
       L 400 300 
       L 448 300" 
    stroke="#ffffff" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    filter="url(#shadow)" 
  />
  
  <!-- Glowing Dot at the end of the pulse -->
  <circle cx="448" cy="300" r="16" fill="#10b981" filter="url(#shadow)" />
  <circle cx="448" cy="300" r="8" fill="#ffffff" />
</svg>
