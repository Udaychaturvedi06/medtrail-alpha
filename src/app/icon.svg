<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Dark Tech Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" /> <!-- slate-900 -->
      <stop offset="100%" stop-color="#020617" /> <!-- slate-950 -->
    </linearGradient>
    
    <!-- Vibrant Teal to Blue Gradient for the Logo -->
    <linearGradient id="m-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" /> <!-- teal-400 -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- blue-500 -->
    </linearGradient>
    
    <!-- Subtle Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Smooth Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Thick, Minimalist 'M' for MedTrail -->
  <path 
    d="M 136 360 V 200 L 256 296 L 376 200 V 360" 
    stroke="url(#m-grad)" 
    stroke-width="72" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    filter="url(#glow)"
  />
  
  <!-- Floating accent dot symbolizing health / data point -->
  <circle cx="256" cy="136" r="36" fill="url(#m-grad)" filter="url(#glow)" />
</svg>
